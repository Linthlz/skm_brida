name: Deploy frontend ke GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-frontend.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # shortcut: plugin-react 4 belum mendeklarasikan vite 8 sebagai peer; hapus flag setelah plugin di-upgrade.
      - run: npm ci --legacy-peer-deps
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          # Variabel repo; isi dengan URL publik backend, contoh https://api.domain.go.id/api
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      # Pages tidak mengenal rute SPA: 404.html menangani refresh di rute seperti /admin.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
