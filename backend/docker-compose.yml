# Development: PostgreSQL + migrasi otomatis + backend dengan hot reload (Air).
#   docker compose up --build            # jalankan semua
#   docker compose --profile tools run --rm seed   # isi data demo (opsional)
# Variabel diambil dari backend/.env (lihat .env.example).
name: singariset

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER di .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD di .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB di .env}
    ports:
      # 5433 di host agar tidak bentrok dengan PostgreSQL lokal (Laragon) di 5432
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./database/migration:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    restart: "no"

  backend:
    build:
      context: .
      target: dev
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      PORT: "3000"
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    volumes:
      - .:/app
      - uploads:/app/public/storage
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  seed:
    profiles: ["tools"]
    build:
      context: .
      target: dev
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - .:/app
      - uploads:/app/public/storage
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    command: ["go", "run", "./cmd/seed"]
    restart: "no"

volumes:
  pgdata:
  # Semua file upload (sampul berita, proposal PDF, foto dokumentasi) — tetap ada
  # walau container dihapus atau di-rebuild.
  uploads:
  gomod:
  gobuild:
